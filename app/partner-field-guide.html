<title>Cloud Partner Field Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-manual app. Fixed chapter rail on the left (top tabs on phones), one chapter on screen at a time, routed by #hash. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e8ecf0; --line:#d3dae1;
  --ink:#14202b; --muted:#56656f; --accent:#0b7a75; --accent-ink:#ffffff; --accent-soft:#d6efec;
  --signal:#c2571a; --signal-soft:#fbe6d8; --good:#2e7d32; --warn:#a36b00; --bad:#b3261e;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161d; --surface:#15212b; --sunk:#1b2a36; --line:#2a3b49;
  --ink:#e4ecf1; --muted:#97a8b4; --accent:#3fc1b8; --accent-ink:#06201e; --accent-soft:#163a39;
  --signal:#f0915a; --signal-soft:#3b2416; --good:#6cc070; --warn:#e2b34a; --bad:#ef7b72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161d; --surface:#15212b; --sunk:#1b2a36; --line:#2a3b49;
  --ink:#e4ecf1; --muted:#97a8b4; --accent:#3fc1b8; --accent-ink:#06201e; --accent-soft:#163a39;
  --signal:#f0915a; --signal-soft:#3b2416; --good:#6cc070; --warn:#e2b34a; --bad:#ef7b72; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700}
h4{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px}
.brand{padding:0 8px 18px;display:grid;gap:4px}
.brand b{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.01em}
.rail nav{display:grid;gap:2px}
.navlink{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14px}
.navlink .num{font-family:var(--mono);font-size:11px;color:var(--muted)}
.navlink:hover{background:var(--sunk)}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.navlink[aria-current="page"] .num{color:var(--accent)}
.navgroup{margin:12px 10px 4px}
.themebtn{margin:18px 8px 0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}

main{min-width:0;padding-block:32px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1080px;margin:0 auto;display:grid;gap:28px}
.lede{font-size:17px;max-width:68ch;color:var(--muted)}
.section{display:grid;gap:14px}
.section > header{display:grid;gap:6px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.card.flat{background:transparent}
.card.small,.card:has(> b:first-child){display:block}
.card.tint{background:var(--accent-soft);border-color:transparent}
.card.warnc{background:var(--signal-soft);border-color:transparent}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.s{background:var(--signal-soft);color:var(--signal);border-color:transparent}
.tags{display:flex;flex-wrap:wrap;gap:6px}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* flow / stepper */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.step{flex:1 1 120px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;display:grid;gap:2px;position:relative}
.step .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step .t{font-weight:600;font-size:14px;line-height:1.25}
.step:hover{border-color:var(--accent)}
.step[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.8}
.arrow{align-self:center;flex:0 0 22px;height:2px;font-size:0;position:relative;background:linear-gradient(90deg,var(--accent) 55%,transparent 0) 0 0/8px 2px;animation:dash .7s linear infinite}
.arrow::after{content:"";position:absolute;right:-2px;top:-4px;border:5px solid transparent;border-left:6px solid var(--accent);border-right:0}
.detail{align-content:start;align-self:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.detail .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* tabs / chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* checklist */
.check{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:8px;cursor:pointer}
.check:hover{background:var(--sunk)}
.check input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--accent)}
.check.done span{color:var(--muted);text-decoration:line-through}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.levels{display:grid;gap:8px}
.level{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--ink)}
.level:hover{border-color:var(--accent)}
.level .lv{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);text-align:center}

/* infra diagram */
.infra{display:grid;gap:10px}
.box{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;cursor:pointer;background:transparent;text-align:left}
.box[aria-pressed="true"]{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.box .lbl{font-family:var(--mono);font-size:12px;color:var(--muted)}
.azrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dcrow{display:flex;gap:6px;flex-wrap:wrap}
.dc{width:30px;height:22px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}

/* shared responsibility */
.stack{display:grid;gap:4px}
.layer{display:grid;grid-template-columns:1fr 110px;align-items:center;border-radius:6px;padding:7px 10px;font-size:14px}
.layer.you{background:var(--signal-soft)} .layer.aws{background:var(--accent-soft)}
.layer b{font-family:var(--mono);font-size:11.5px;text-align:right;font-weight:500}
.layer.you b{color:var(--signal)} .layer.aws b{color:var(--accent)}

/* ladder */
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.rung{border:1px solid var(--line);background:var(--surface);border-radius:var(--r) var(--r) 4px 4px;padding:10px;display:grid;align-content:end;gap:2px;text-align:left}
.rung[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rung .h{font-family:var(--display);font-weight:700;font-size:16px}

/* org map */
.org{display:grid;grid-template-columns:minmax(0,1fr) 80px minmax(0,1fr);gap:10px;align-items:start}
.orgcol{display:grid;gap:6px}
.orgnode{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;font-size:14px;display:grid;gap:1px}
.orgnode small{color:var(--muted);font-size:12px}
.orgnode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bridge{display:grid;place-items:center;height:100%;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;writing-mode:vertical-rl;border-left:1px dashed var(--line);border-right:1px dashed var(--line)}

/* timeline */
.months{display:grid;grid-template-columns:repeat(12,minmax(58px,1fr));gap:4px;min-width:720px}
.mon{display:grid;gap:4px;align-content:start}
.mon .mh{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:4px 0;border-bottom:2px solid var(--line)}
.mon .mh.q{border-color:var(--accent)}
.ev{font-size:11.5px;line-height:1.25;padding:5px 6px;border-radius:6px;background:var(--sunk);border:0;text-align:left}
.ev.big{background:var(--accent);color:var(--accent-ink)}
.ev.fin{background:var(--signal-soft);color:var(--ink)}
.hist{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.hi{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0 8px 14px;position:relative}
.hi::before{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.hi .y{font-family:var(--mono);font-weight:500;color:var(--accent)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}

/* quiz */
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin:0}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.out{font-family:var(--display);font-size:28px;font-weight:700}
.do{border-left:3px solid var(--good);padding-left:10px}
.dont{border-left:3px solid var(--bad);padding-left:10px}

/* architecture lanes */
.arch{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.lane{flex:1 0 128px;display:grid;gap:6px;align-content:start;background:var(--sunk);border-radius:var(--r);padding:10px}
.lane .ln{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.svc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;text-align:left;font-size:13px;font-weight:600;line-height:1.25}
.svc small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.svc[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lanearrow{align-self:center;flex:0 0 20px;height:2px;font-size:0;position:relative;background:linear-gradient(90deg,var(--accent) 55%,transparent 0) 0 0/8px 2px;animation:dash .7s linear infinite}
.lanearrow::after{content:"";position:absolute;right:-2px;top:-4px;border:5px solid transparent;border-left:6px solid var(--accent);border-right:0}
/* stack diagram */
.tier3{display:grid;gap:6px}
.tierrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:stretch}
.tierrow .tl{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px;font-family:var(--display);font-weight:700;display:grid;align-content:center}
.tierrow .tl small{font-family:var(--body);font-weight:400;font-size:12px;opacity:.85}
.tierrow .ti{display:flex;flex-wrap:wrap;gap:6px;background:var(--sunk);border-radius:8px;padding:8px}
/* kpi tracker */
.kpirow{display:grid;grid-template-columns:minmax(0,1.6fr) 90px 90px 110px 32px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.kpirow:last-child{border-bottom:0}
.kpirow input{padding:6px 8px}
.kbar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:4px}
.kbar i{display:block;height:100%}
.xbtn{border:1px solid var(--line);background:transparent;border-radius:6px;width:30px;height:30px;color:var(--muted)}
.pill{justify-self:start;display:inline-block;font-size:11.5px;font-family:var(--mono);padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.flywheel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;counter-reset:fw}
.fw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:13.5px;position:relative}
.fw b{display:block;font-family:var(--display);font-size:15px}
.fw::after{content:"\2192";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--accent);font-family:var(--mono);background:var(--bg);padding:0 1px}
.fw:last-child::after{content:"\21BA"}
.dr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dr .card{border-top:4px solid var(--accent)}

@media (max-width:860px){
  .kpirow{grid-template-columns:1fr 1fr;}
  .kpirow > :first-child{grid-column:1/-1}
  .tierrow{grid-template-columns:1fr}
  .dr{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fw::after{display:none}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand{padding:0 4px 8px;grid-template-columns:1fr auto;align-items:center}
  .brand .muted{display:none}
  .rail nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  .navlink{white-space:nowrap;grid-template-columns:auto auto;padding:6px 10px}
  .navgroup,.themebtn.side{display:none}
  .hero{grid-template-columns:1fr}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}
  .org{grid-template-columns:1fr}
  .bridge{writing-mode:horizontal-tb;height:auto;padding:6px;border:0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
  .azrow{grid-template-columns:1fr}
}
/* motion */
@keyframes dash{to{background-position:8px 0}}
@keyframes flowdash{to{stroke-dashoffset:-24}}
@keyframes rise{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 0%,transparent)}}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
svg circle.gc{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fw{0%,14%{background:var(--accent-soft);border-color:var(--accent);transform:translateY(-3px)}22%,100%{background:var(--surface);border-color:var(--line);transform:none}}
.page > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.card,.step,.svc,.orgnode,.level,.rung,.chip,.opt{transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.card:hover,.level:hover{transform:translateY(-2px);box-shadow:0 10px 24px -16px color-mix(in srgb,var(--ink) 55%,transparent)}
.step:hover,.svc:hover,.orgnode:hover{transform:translateY(-2px)}
.step[aria-pressed="true"],.svc[aria-pressed="true"],.rung[aria-pressed="true"]{animation:glow 1.8s ease-out infinite}
.step.done{background:var(--accent-soft);border-color:transparent}
.step.done .n::before{content:"✓ ";color:var(--accent)}
.flowbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.playbtn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600}
.playbtn:hover,.playbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pipe{overflow-x:auto;padding:4px 0}
.pipe svg{width:100%;height:auto;display:block}
.pipe svg text{font-family:var(--body);font-size:12px}
.pipe-flow{animation:flowdash .9s linear infinite}
.pipe svg [tabindex]:focus{outline:none}
.pipe g[data-pipe]:hover > circle,.pipe g[data-pipe]:hover > rect,.pipe g[data-pipe]:focus-visible > circle,.pipe g[data-pipe]:focus-visible > rect,.hub g:focus-visible > circle{stroke-width:5}
.pipe g.on > circle,.pipe g.on > rect,.hub g[aria-pressed="true"] > circle{fill:var(--accent)}
.pipe g.on > text.num,.hub g[aria-pressed="true"] > text.num{fill:var(--accent-ink)!important}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.chart rect.gx,svg rect.gx{transform-box:fill-box;transform-origin:left center;animation:gx .9s cubic-bezier(.2,.8,.2,1) both}
.chart rect.gy,svg rect.gy{transform-box:fill-box;transform-origin:center bottom;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.chart rect.gc,svg rect.gc{transform-box:fill-box;transform-origin:center;animation:gx .9s cubic-bezier(.2,.8,.2,1) both}
path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards}
.rung{transform-origin:bottom;animation:gy .7s cubic-bezier(.2,.8,.2,1) both}
.rung:nth-child(2){animation-delay:.1s}.rung:nth-child(3){animation-delay:.2s}.rung:nth-child(4){animation-delay:.3s}
.fw{animation:fw 7s infinite}
.fw:nth-child(2){animation-delay:1.15s}.fw:nth-child(3){animation-delay:2.3s}.fw:nth-child(4){animation-delay:3.45s}.fw:nth-child(5){animation-delay:4.6s}.fw:nth-child(6){animation-delay:5.75s}
.lane{transition:background .25s,box-shadow .25s}
.lane.lit{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.bar > i,.kbar i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}path.draw{stroke-dasharray:none;stroke-dashoffset:0}}
</style>

<div class="shell">
  <aside class="rail">

/* Generic clickable flow: steps = [{t, d, sub?, do:[], check:[], tools:[]}] */
function flow(id, steps, opts={}){
  const sel = 0;
  const btns = steps.map((s,i)=>`${i?'<span class="arrow" aria-hidden="true">\u2192</span>':''}<button type="button" class="step" data-flow="${id}" data-i="${i}" aria-pressed="${i===sel}"><span class="n">${opts.label||'Step'} ${i+1}</span><span class="t">${s.t}</span></button>`).join('');
  const pipe = opts.pipe ? pipeSVG(id, steps.map(s=>s.t), opts.icon) : '';
  return `${pipe}<div class="flowbar">${playBtn('data-play', id, '\u25B6 Play walkthrough')}<span class="small muted">${steps.length} ${(opts.label||'step').toLowerCase()}s · click any to explore</span></div><div class="flow" role="group">${btns}</div><div class="detail" id="fd-${id}">${flowDetail(steps[sel])}</div>`;
}
function flowDetail(s){
  const col = (title, arr) => arr && arr.length ? `<div><div class="eyebrow">${title}</div><ul class="clean">${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>` : '';
  const cols = s.cols ? s.cols.map(c=>col(c[0], c[1])).join('') : `${col('What happens / what to do', s.do)}${col('Checks before moving on', s.check)}${col('Tools & owners', s.tools)}`;
  return `<h3>${s.t}</h3><p>${s.d}</p><div class="cols">${cols}</div>`;
}

/* Architecture lane diagram: lanes = [{n, items:[[name, short, detail]]}] */
const ARCHS = {};
function arch(id, lanes, note){
  ARCHS[id] = lanes;
  const html = lanes.map((l,li)=>`${li?'<span class="lanearrow" aria-hidden="true">→</span>':''}<div class="lane" data-lane="${id}|${li}"><span class="ln">${l.n}</span>${l.items.map((it,ii)=>`<button type="button" class="svc" data-arch="${id}|${li}|${ii}" aria-pressed="${li===0&&ii===0}">${it[0]}<small>${it[1]}</small></button>`).join('')}</div>`).join('');
  const first = lanes[0].items[0];
  return `<div class="flowbar">${playBtn('data-trace', id, '\u25B6 Trace the flow')}<span class="small muted">${lanes.length} stages · click any box</span></div><div class="arch">${html}</div><div class="detail" id="ad-${id}"><h4>${first[0]}</h4><p class="small">${first[2]}</p></div>${note?`<p class="small muted">${note}</p>`:''}`;
}
function showArch(key){
  const [id,li,ii] = key.split('|'); const it = ARCHS[id][+li].items[+ii];
  $('#ad-'+id).innerHTML = `<h4>${it[0]}</h4><p class="small">${it[2]}</p>`;
  document.querySelectorAll(`[data-arch^="${id}|"]`).forEach(b=>b.setAttribute('aria-pressed', b.dataset.arch===key));
  document.querySelectorAll(`[data-lane^="${id}|"]`).forEach(l=>l.classList.toggle('lit', l.dataset.lane===`${id}|${li}`));
}

/* Horizontal bar chart: rows = [[label, value]] */
function hbars(rows, opts={}){
  const max = opts.max || Math.max(...rows.map(r=>r[1]));
  const W=560, lh=30, pl=opts.pl||190, pr=56, H=rows.length*lh+10;
  let g='';
  rows.forEach((r,i)=>{ const y=i*lh+6, w=(W-pl-pr)*r[1]/max;
    g+=`<text x="${pl-8}" y="${y+15}" text-anchor="end" style="fill:var(--ink)">${r[0]}</text><rect x="${pl}" y="${y+3}" width="${W-pl-pr}" height="16" rx="3" fill="var(--sunk)"/><rect class="gx" style="animation-delay:${i*70}ms" x="${pl}" y="${y+3}" width="${Math.max(w,2)}" height="16" rx="3" fill="${r[2]||'var(--accent)'}"/><text x="${pl+w+6}" y="${y+15}">${opts.fmt?opts.fmt(r[1]):r[1]}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label||'Bar chart'}">${g}</svg></div>`;
}

function calcTCO(){
  const v = id => +($('#'+id)?.value||0), Y=3;
  const onHw = v('tcS')*v('tcH'), onDc = v('tcS')*v('tcD')*Y, onMaint = onHw*v('tcM')/100*Y, onStaff = v('tcF')*v('tcSal')*Y;
  const on = onHw+onDc+onMaint+onStaff;
  const clRun = v('tcC')*12*Y*(1-v('tcSP')/100), clStaff = v('tcF2')*v('tcSal')*Y, clMig = Math.max(v('tcMig')-v('tcFund'),0);
  const cl = clRun+clStaff+clMig, save = on-cl, inv = clMig;
  const W=520,H=210,pl=110,pr=20, max=Math.max(on,cl,1);
  const seg = (y, parts) => { let x=pl, s=''; parts.forEach(p=>{ const w=(W-pl-pr)*p[0]/max; s+=`<rect class="${FIRST?'gx':''}" x="${x}" y="${y}" width="${Math.max(w,0)}" height="34" fill="${p[1]}"><title>${p[2]}: ${money(p[0])}</title></rect>`; x+=w; }); return s; };
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Three-year cost: on-premises ${money(on)}, AWS ${money(cl)}">
    <text x="${pl-8}" y="42" text-anchor="end" style="fill:var(--ink)">On-premises</text>${seg(20,[[onHw,'var(--signal)','Hardware'],[onDc,'color-mix(in srgb,var(--signal) 65%,var(--surface))','Data center'],[onMaint,'color-mix(in srgb,var(--signal) 40%,var(--surface))','Maintenance'],[onStaff,'var(--muted)','Staff']])}
    <text x="${pl-8}" y="102" text-anchor="end" style="fill:var(--ink)">AWS</text>${seg(80,[[clRun,'var(--accent)','AWS usage'],[clMig,'color-mix(in srgb,var(--accent) 50%,var(--surface))','Migration net of funding'],[clStaff,'var(--muted)','Staff']])}
    <g transform="translate(${pl},150)">${[['var(--signal)','Hardware'],['var(--accent)','AWS usage'],['var(--muted)','Staff'],['color-mix(in srgb,var(--accent) 50%,var(--surface))','Migration']].map((l,i)=>`<rect x="${i*100}" y="0" width="10" height="10" fill="${l[0]}"/><text x="${i*100+14}" y="9">${l[1]}</text>`).join('')}</g></svg>`;
  $('#tcOut').innerHTML = `<div class="chart">${svg}</div><div class="kv"><dt>On-premises, 3 years</dt><dd class="mono">${money(on)}</dd><dt>AWS, 3 years</dt><dd class="mono">${money(cl)}</dd></div><div class="eyebrow">${save>=0?'Savings':'Extra cost'}</div><div class="out mono" style="color:${save>=0?'var(--good)':'var(--bad)'}">${money(Math.abs(save))} <span class="small muted">(${on?Math.round(save/on*100):0}%)</span></div><p class="small muted">${inv>0&&save>0?`Return on the net migration investment: ${Math.round(save/inv*100)}%. `:''}Simplified model; real TCO studies also count licensing, downtime and staff productivity.</p>`;
}

function aiMatrix(){
  const W=420,H=340,p=40, sx=v=>p+(W-p-14)*(v/10), sy=v=>H-p-(H-p-14)*(v/10);
  let g=`<rect x="${sx(5)}" y="${sy(10)}" width="${sx(10)-sx(5)}" height="${sy(5)-sy(10)}" fill="var(--accent-soft)"/><text x="${sx(9.8)}" y="${sy(9.6)}" text-anchor="end" style="fill:var(--accent)">Start here</text>`;
  g+=`<line x1="${p}" y1="${sy(0)}" x2="${W-14}" y2="${sy(0)}" stroke="var(--line)"/><line x1="${p}" y1="${sy(0)}" x2="${p}" y2="14" stroke="var(--line)"/>`;
  g+=`<text x="${(W+p)/2}" y="${H-8}" text-anchor="middle">Feasibility (data, effort, risk) →</text><text transform="translate(14 ${(H-p)/2}) rotate(-90)" text-anchor="middle">Business value →</text>`;
  AI_USES.forEach((u,i)=>{ g+=`<circle cx="${sx(u[2])}" cy="${sy(u[1])}" r="9" fill="var(--signal)" stroke="var(--surface)" stroke-width="2" data-ai="${i}" style="cursor:pointer" tabindex="0" role="button" aria-label="${u[0]}"/><text x="${sx(u[2])}" y="${sy(u[1])+4}" text-anchor="middle" style="fill:var(--surface);font-size:10px;pointer-events:none">${i+1}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="AI use cases plotted by value and feasibility">${g}</svg><ol class="small" style="margin:6px 0 0;padding-left:20px;columns:2">${AI_USES.map(u=>`<li>${u[0]}</li>`).join('')}</ol>`;
}
function showAI(i){ const u=AI_USES[i]; $('#aiD').innerHTML = `<h3>${i+1}. ${u[0]}</h3><p>${u[3]}</p><div class="kv small"><dt>Value</dt><dd>${u[1]}/10</dd><dt>Feasibility</dt><dd>${u[2]}/10</dd><dt>Measure with</dt><dd>${u[4]}</dd></div>`; }
function calcAI(){
  const v = id => +($('#'+id)?.value||0);
  const perReq = v('aiI')/1000*v('aiPi') + v('aiO')/1000*v('aiPo'), month = perReq*v('aiR')*30;
  $('#aiOut').innerHTML = `<div class="eyebrow">Cost per request</div><div class="out mono">$${perReq.toFixed(4)}</div><div class="eyebrow">Per month (30 days)</div><div class="out mono">${money(month)}</div><p class="small muted">Levers: shorter prompts, smaller models for simple tasks, caching repeated context, and batch processing where real-time isn’t needed.</p>`;
}

function pnlChart(){
  const W=800,H=300,pl=10,pb=50,pt=20, n=PNL.length, bw=(W-pl*2)/n, y=v=>pt+(H-pt-pb)*(1-v/100);
  let run=0, g='';
  PNL.forEach((p,i)=>{ let top,bot,col;
    if(p[2]==='t'){ run=p[1]; top=y(p[1]); bot=y(0); col='var(--accent)'; }
    else { const nr=run+p[1]; top=y(Math.max(run,nr)); bot=y(Math.min(run,nr)); col=p[1]<0?'var(--signal)':'var(--good)'; run=nr; }
    const x=pl+i*bw+bw*.15, w=bw*.7;
    g+=`<rect class="gy" style="animation-delay:${i*90}ms" x="${x}" y="${top}" width="${w}" height="${Math.max(bot-top,1)}" rx="3" fill="${col}"/><text x="${x+w/2}" y="${top-5}" text-anchor="middle" style="fill:var(--ink)">${p[1]>0&&p[2]!=='t'?'+':''}${p[1]}</text>`;
    const words=p[0].split(' '), half=Math.ceil(words.length/2);
    g+=`<text x="${x+w/2}" y="${H-pb+16}" text-anchor="middle">${words.slice(0,half).join(' ')}</text><text x="${x+w/2}" y="${H-pb+30}" text-anchor="middle">${words.slice(half).join(' ')}</text>`;
  });
  g+=`<line x1="${pl}" x2="${W-pl}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:560px" role="img" aria-label="Illustrative P&L waterfall from revenue 100 to operating profit 18">${g}</svg></div>`;
}
function calcCE(){
  const v=id=>+($('#'+id)?.value||0);
  const rev=v('ceN')*v('ceR')*v('ceH')*v('ceU')/100, cost=v('ceN')*v('ceC'), gm=rev?(rev-cost)/rev*100:0;
  const be = v('ceR')*v('ceH') ? v('ceC')/(v('ceR')*v('ceH'))*100 : 0;
  $('#ceOut').innerHTML = `<div class="eyebrow">Annual services revenue</div><div class="out mono">${money(rev)}</div><div class="eyebrow">Gross margin</div><div class="out mono" style="color:${gm>=30?'var(--good)':gm>=15?'var(--warn)':'var(--bad)'}">${gm.toFixed(0)}%</div><p class="small muted">Break-even utilization: ${be.toFixed(0)}%. Every 5 points of utilization adds about ${money(v('ceN')*v('ceR')*v('ceH')*0.05)} a year.</p>`;
}

function calcFunnel(){
  const v=id=>+($('#'+id)?.value||0);
  const vis=v('fnV'), leads=vis*v('fnL')/100, mql=leads*v('fnM')/100, sql=mql*v('fnS')/100, won=sql*v('fnW')/100, rev=won*v('fnD');
  const spend=v('fnB'), cpl=leads?spend/leads:0, cac=won?spend/won:0, roi=spend?(rev-spend)/spend*100:0;
  const perVisitor = vis ? rev/vis : 0, needVis = perVisitor ? v('fnT')/3/perVisitor : 0;
  const rows=[['Visitors',vis],['Leads',leads],['MQLs',mql],['SQLs',sql],['Won deals',won]];
  const W=420,lh=34,H=rows.length*lh+4, mx=Math.max(vis,1);
  let g=''; rows.forEach((r,i)=>{ const w=Math.max((W-210)*Math.sqrt(r[1]/mx),3), x=150+((W-210)-w)/2;
    g+=`<text x="10" y="${i*lh+22}" style="fill:var(--ink)">${r[0]}</text><rect class="${FIRST?'gc':''}" style="animation-delay:${i*90}ms" x="${x}" y="${i*lh+6}" width="${w}" height="24" rx="4" fill="${i===rows.length-1?'var(--signal)':'var(--accent)'}" opacity="${1-i*0.12}"/><text x="${W-4}" y="${i*lh+22}" text-anchor="end" style="fill:var(--ink)">${r[1]<10?r[1].toFixed(1):Math.round(r[1]).toLocaleString()}</text>`; });
  $('#fnOut').innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly funnel">${g}</svg></div>
  <div class="kv"><dt>Revenue / month</dt><dd class="mono">${money(rev)}</dd><dt>Cost per lead</dt><dd class="mono">${money(cpl)}</dd><dt>Marketing cost per won deal</dt><dd class="mono">${money(cac)}</dd><dt>Marketing ROI</dt><dd class="mono">${roi.toFixed(0)}%</dd><dt>Visitors needed / month for target</dt><dd class="mono">${Math.ceil(needVis).toLocaleString()}</dd></div>
  <p class="small muted">Square-root scale so small stages stay visible. ROI here counts marketing spend only, not sales salaries. Improving any one conversion rate by a few points often beats buying more traffic.</p>`;
}
function calcUTM(){ const g=id=>($('#'+id)?.value||'').trim();
  const base=g('utmU'); const p=[['utm_source','utmS'],['utm_medium','utmM'],['utm_campaign','utmC'],['utm_content','utmX']].filter(x=>g(x[1])).map(x=>x[0]+'='+encodeURIComponent(g(x[1]).toLowerCase().replace(/\s+/g,'-'))).join('&');
  $('#utmOut').textContent = base ? base + (base.includes('?')?'&':'?') + p : 'Enter a page URL'; }

function ownLoad(){ return store.get('own', null) || OWN_DEFAULT.map(o=>({...o})); }
function logLoad(){ return store.get('worklog', null) || LOG_DEFAULT.map(o=>({...o})); }
function renderOwn(){ const b=$('#ownBody'); if(!b) return; const l=ownLoad();
  const col = s => s==='Healthy'?'var(--good)':s==='Needs attention'?'var(--warn)':s==='At risk'?'var(--bad)':'var(--muted)';
  b.innerHTML = l.length ? l.map((o,i)=>`<tr><td><b>${esc(o.n)}</b>${o.ex?' <span class="tag">example</span>':''}</td><td class="small">${esc(o.t)}</td><td class="small">${esc(o.f)}</td>
    <td><select id="ownS${i}" data-own-st="${i}" style="width:auto;padding:4px 6px;color:${col(o.s)}">${['Healthy','Needs attention','At risk','Not started'].map(s=>`<option ${s===o.s?'selected':''}>${s}</option>`).join('')}</select></td>
    <td class="small mono">${o.r?esc(o.r):'<span class="muted">never</span>'} <button class="btn ghost" type="button" data-own-rev="${i}" style="padding:2px 8px;font-size:12px">Reviewed today</button></td>
    <td><button class="xbtn" type="button" data-own-del="${i}" aria-label="Remove">×</button></td></tr>`).join('') : '<tr><td colspan="6" class="muted">Nothing listed yet. Add the first thing you own above.</td></tr>'; }
function renderLog(){ const box=$('#logList'); if(!box) return; const l=logLoad().map((x,i)=>[x,i]).sort((a,b)=>b[0].d.localeCompare(a[0].d));
  const counts = {}; l.forEach(([x])=>counts[x.c]=(counts[x.c]||0)+1);
  $('#logSum').innerHTML = `<span class="small muted">${l.length} entries:</span>` + Object.entries(counts).map(([k,v])=>`<span class="tag a">${esc(k)} · ${v}</span>`).join('');
  box.innerHTML = l.length ? l.map(([x,i])=>`<div class="card flat" style="grid-template-columns:1fr auto;display:grid;gap:4px 10px"><div><span class="mono small muted">${esc(x.d)}</span> <span class="tag">${esc(x.c)}</span>${x.ex?' <span class="tag">example</span>':''}<p style="margin-top:4px"><b>${esc(x.w)}</b></p><p class="small">Result: ${esc(x.i)||'<span class="muted">add a number</span>'}</p>${x.e?`<p class="small muted">Evidence: ${esc(x.e)}</p>`:''}</div><button class="xbtn" type="button" data-log-del="${i}" aria-label="Remove entry">×</button></div>`).join('') : '<p class="muted small">No entries yet. Add your first win above.</p>'; }
function calcImpact(){ const v=id=>+($('#'+id)?.value||0);
  const yr = v('imH')*v('imR')*12; $('#imOut1').innerHTML = `<div class="eyebrow">Value per year</div><div class="out mono">${money(yr)}</div><p class="small muted">Say: “saves about ${Math.round(v('imH')*12)} hours a year.”</p>`;
  const cash = v('imA')/365*v('imD'); $('#imOut2').innerHTML = `<div class="eyebrow">Cash freed</div><div class="out mono">${money(cash)}</div><p class="small muted">Money in the bank sooner instead of sitting in receivables.</p>`;
  $('#imOut3').innerHTML = `<div class="eyebrow">Total to report</div><div class="out mono">${money(v('imF')+v('imP'))}</div><p class="small muted">Report recovered money and influenced pipeline separately; pipeline isn’t revenue yet.</p>`;
  const s=v('crS'), lo=v('crL'), hi=v('crH'), mid=(lo+hi)/2, cr=mid? s/mid:0, pos = hi>lo ? Math.min(Math.max((s-lo)/(hi-lo),0),1) : 0;
  $('#crOut').innerHTML = `<div style="position:relative;height:28px;margin-top:8px"><div class="bar" style="position:absolute;inset:10px 0 auto"><i style="width:100%;background:var(--accent-soft)"></i></div><span style="position:absolute;left:50%;top:4px;width:2px;height:20px;background:var(--muted)"></span><span style="position:absolute;left:calc(${pos*100}% - 7px);top:7px;width:14px;height:14px;border-radius:50%;background:var(--signal)"></span></div>
    <div class="kv small"><dt>Band midpoint</dt><dd class="mono">${money(mid)}</dd><dt>Compa-ratio</dt><dd class="mono">${cr.toFixed(2)}</dd><dt>Gap to midpoint</dt><dd class="mono">${money(Math.max(mid-s,0))}</dd></div>`; }

function valCalc(r){ const b=+r.b, t=+r.t, c=+r.c, v=+r.v;
  const promised = Math.abs(t-b), down = t < b;
  const achieved = down ? b-c : c-b;
  const prog = promised ? achieved/promised : 0;
  return {prog, realised: Math.max(achieved,0)*v, target: promised*v}; }
function renderVal(){ const body=$('#valBody'); if(!body) return; const l=valLoad();
  const inp=(i,f,val,lab,w)=>`<input type="${f==='n'?'text':'number'}" id="val${f}${i}" data-vf="${f}" data-vi="${i}" value="${esc(val)}" aria-label="${lab}" style="font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:${w}">`;
  body.innerHTML = l.map((r,i)=>{ const k=valCalc(r), col = k.prog>=1?'var(--good)':k.prog>=0.6?'var(--warn)':'var(--bad)';
    return `<tr><td style="min-width:240px">${inp(i,'n',r.n,'KPI','100%')}${r.ex?' <span class="tag">example</span>':''}</td><td>${inp(i,'b',r.b,'Baseline','90px')}</td><td>${inp(i,'t',r.t,'Target','90px')}</td><td>${inp(i,'c',r.c,'Current','90px')}</td><td>${inp(i,'v',r.v,'Value per unit','90px')}</td>

function valSummary(){ const l=valLoad(); let real=0, tgt=0; l.forEach(r=>{ const k=valCalc(r); real+=k.realised; tgt+=k.target; });

  g+=`<g class="spin"><circle cx="${cx}" cy="${cy}" r="62" fill="var(--accent-soft)" stroke="var(--accent)" stroke-dasharray="4 6"/></g><text x="${cx}" y="${cy-4}" text-anchor="middle" style="font-family:var(--display);font-weight:800;font-size:17px;fill:var(--ink)">${center[0]}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" style="fill:var(--muted)">${center[1]}</text>`;

  const dec=(raw.split('.')[1]||'').length, comma=raw.includes(','), pre=txt.slice(0,m.index), post=txt.slice(m.index+raw.length), t0=performance.now(), d=750;

function waveGantt(){
  const W=760, lh=36, pl=150, pr=20, H=WAVES.length*lh+40, max=26, x=v=>pl+(W-pl-pr)*v/max;
  let g=''; for(let wk=0; wk<=max; wk+=2){ g+=`<line x1="${x(wk)}" x2="${x(wk)}" y1="10" y2="${H-24}" stroke="var(--line)" stroke-dasharray="${wk%4?'2 4':'0'}"/><text x="${x(wk)}" y="${H-8}" text-anchor="middle">${wk}</text>`; }
  WAVES.forEach((w,i)=>{ const y=i*lh+14; g+=`<text x="${pl-8}" y="${y+16}" text-anchor="end" style="fill:var(--ink);font-weight:600">${w[0]}</text><rect class="gx" style="animation-delay:${i*160}ms" x="${x(w[1])}" y="${y}" width="${x(w[2])-x(w[1])}" height="22" rx="5" fill="${i===WAVES.length-1?'var(--signal)':'var(--accent)'}" opacity="${0.55+i*0.08}"><title>${w[3]}</title></rect>${w[2]>20?`<text x="${x(w[1])-6}" y="${y+15}" text-anchor="end" style="font-size:10.5px">${w[3]}</text>`:`<text x="${x(w[2])+6}" y="${y+15}" style="font-size:10.5px">${w[3]}</text>`}`; });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W+190} ${H}" style="min-width:720px" role="img" aria-label="Sample migration wave plan over 26 weeks">${g}</svg></div>`; }

  <div class="card tint small"><b>Two different “roots”:</b> the <b>organization root</b> is the top folder of the account tree. The <b>root user</b> is the original email-and-password login of a single AWS account. Same word, different things.</div></section>

  <section class="section"><header><h2>Root users</h2><p class="muted">Every AWS account has one root user: the email address and password used to create it. It has unrestricted power over that account, so it’s protected and almost never used.</p></header>
  <div class="grid g2">
    <div class="card warnc"><h4>Tasks only the root user can do</h4><ul class="clean small">${ROOT_TASKS.map(t=>`<li>${t}</li>`).join('')}</ul><p class="small muted">AWS maintains the official list; check the IAM documentation for current details.</p></div>
    <div class="card"><h4>Root user vs everyday access</h4><div class="tablewrap"><table><thead><tr><th></th><th>Root user</th><th>Identity Center role</th></tr></thead><tbody>
      <tr><td>Login</td><td>Email + password + MFA</td><td>Company SSO + MFA</td></tr>

  <h3>Root sign-in alert pipeline</h3>

    {t:'Root signs in', d:'Someone signs in to the console with the root user, intended or not.', do:['Should only happen in a documented break-glass event'], check:['Ticket exists for the event'], tools:['AWS console']},

  <section class="section"><header><h2>Zero Trust</h2><p class="muted">Zero Trust is a security model: never trust a request just because it comes from “inside” the network. Verify every request, every time, using identity, device and context, and give the least access for the shortest time.</p></header>

    <div class="card"><span class="eyebrow">Old model · castle and moat</span>${ztCompare(false)}<p class="small muted">Once someone is inside the network (VPN, office Wi-Fi), they’re trusted broadly. One stolen password can reach everything.</p></div>

  </div>

  window.scrollTo(0,0);
  if(id==='cloud'){ showInfra('region'); showSR(Object.keys(SR.models)[0]); }
  if(id==='services') renderSvc();
  if(id==='partner') showTier(1);
  if(id==='portals') showPortal(0);
  if(id==='people') showOrg('aws-0');
  if(id==='revops') calcWP();
  if(id==='adminops'){ calcMP(); calcDSO(); }
  if(id==='glossary') renderGl();
  if(id==='quiz'){ qi=0; qscore=0; renderQuiz(); }
  if(id==='grow') renderUC();
  if(id==='economics') calcTCO();
  if(id==='value') renderVal();
  if(id==='opsess'){ showLP(0); calcFC(); renderTpl(); renderQ30(); }
  if(id==='reqs'){ showReq(reqSel); showDM(dmSel); }
  if(id==='lifecycle'){ showSeq(0); showBiz(bizStage); renderGL(); }
  if(id==='identity'){ showOrgNode('root'); showAsg(0,0); renderCerts(); renderJML(); }
  if(id==='migration'){ showR(2); rqi=0; renderRQ(); }
  if(id==='catalog') renderPSList();
  if(id==='bvr') showBvrCase(bvrCase);
  if(id==='solutions'){ renderSolList(); calcHost(); renderCh(); }
  if(id==='opps'){ showOpp(oppSel, 0); renderPeople('All'); }
  if(id==='marketing'){ showStage(mkStage); renderIdeas('All'); calcFunnel(); calcUTM(); }
  if(id==='enablement') calcHS();
  if(id==='recognition'){ renderOwn(); renderLog(); calcImpact(); }
  if(id==='ai') calcAI();
  if(id==='industries') showInd(indSel);
  if(id==='ccp'){ cardI=0; cardFlip=false; renderFC(); }
  if(id==='business') calcCE();
  if(id==='roles') showRole(roleSel);
  if(id==='kpis'){ renderKpiLib(); renderKpis(); }
  document.querySelectorAll('#view .out').forEach(countUp);
  setTimeout(()=>{ FIRST = false; }, 900);
  try{ store.set('last', id); }catch(e){}
}
window.addEventListener('hashchange', route);

document.addEventListener('click', e => {
  const t = e.target;
  const pb = t.closest('[data-play],[data-trace],[data-oplay],[data-seqplay]');
  if(pb){ if(PLAY && PLAY.btn===pb){ stopPlay(); return; }
    if(pb.dataset.play){ const id=pb.dataset.play; return startPlay(pb, FLOWS[id].length, i=>selectFlow(id,i)); }
    if(pb.dataset.trace){ const id=pb.dataset.trace; return startPlay(pb, ARCHS[id].length, li=>showArch(`${id}|${li}|0`)); }
    if(pb.dataset.seqplay) return startPlay(pb, SEQ.length, showSeq);
    return startPlay(pb, OPP_SCEN[oppSel].steps.length, k=>showOpp(oppSel,k)); }
  if(t.closest('[data-arch],[data-ostep],[data-opp],[data-sol],[data-solcat],[data-bvrcase],[data-seq],[data-biz]')) stopPlay();
  const inf = t.closest('[data-infra]'); if(inf){ e.stopPropagation(); showInfra(inf.dataset.infra); return; }
  const sr = t.closest('[data-sr]'); if(sr) return showSR(sr.dataset.sr);
  const tier = t.closest('[data-tier]'); if(tier) return showTier(+tier.dataset.tier);
  const org = t.closest('[data-org]'); if(org) return showOrg(org.dataset.org);
  const por = t.closest('[data-portal]'); if(por) return showPortal(+por.dataset.portal);
  const ar = t.closest('[data-arch]'); if(ar) return showArch(ar.dataset.arch);
  const aiu = t.closest('[data-ai]'); if(aiu) return showAI(+aiu.dataset.ai);
  const ind = t.closest('[data-ind]'); if(ind) return showInd(+ind.dataset.ind);
  const rl = t.closest('[data-role]'); if(rl) return showRole(+rl.dataset.role);
  const ka = t.closest('[data-karea]'); if(ka){ kpiArea = ka.dataset.karea; document.querySelectorAll('[data-karea]').forEach(b=>b.setAttribute('aria-pressed', b===ka)); return renderKpiLib(); }
  const kadd = t.closest('[data-kadd]'); if(kadd){ const k = KPI_LIB[+kadd.dataset.kadd], l = kpiLoad(); l.push({n:k[1], t:'', a:'', d:/DSO|Days|Stale|AR over|cycle/i.test(k[1])?'down':'up'}); kpiSave(l); renderKpis(); kadd.textContent='Added'; return; }
  const kdel = t.closest('[data-kdel]'); if(kdel){ const l = kpiLoad(); l.splice(+kdel.dataset.kdel,1); kpiSave(l); return renderKpis(); }
  if(t.id==='kpiAdd'){ const l = kpiLoad(); l.push({n:'New KPI', t:'', a:'', d:'up'}); kpiSave(l); return renderKpis(); }
  if(t.id==='kpiReset'){ kpiSave(KPI_DEFAULT.map(k=>({...k}))); return renderKpis(); }
  if(t.id==='kpiCopy'){ const txt = 'KPI update\n' + kpiLoad().map(k=>`- ${k.n}: ${k.a===''?'n/a':k.a} vs target ${k.t===''?'n/a':k.t} (${kpiStatus(k)[0]})`).join('\n');
    const ta = $('#kpiText'); ta.value = txt;
    const show = () => { ta.hidden = false; ta.select(); };
    try{ navigator.clipboard.writeText(txt).then(()=>{ t.textContent='Copied'; }, show); }catch(err){ show(); }
    return; }
  const ms = t.closest('[data-mstage]'); if(ms) return showStage(ms.dataset.mstage);
  const idea = t.closest('[data-idea]'); if(idea) return renderIdeas(idea.dataset.idea);
  if(t.id==='dcReset'){ store.set('dealcheck', []); return route(); }
  if(t.id==='utmCopy'){ const txt = $('#utmOut').textContent; try{ navigator.clipboard.writeText(txt).then(()=>{ t.textContent='Copied'; }, ()=>{ getSelection().selectAllChildren($('#utmOut')); }); }catch(err){ getSelection().selectAllChildren($('#utmOut')); } return; }
  const odel = t.closest('[data-own-del]'); if(odel){ const l=ownLoad(); l.splice(+odel.dataset.ownDel,1); store.set('own', l); return renderOwn(); }
  const orev = t.closest('[data-own-rev]'); if(orev){ const l=ownLoad(); const o=l[+orev.dataset.ownRev]; o.r=today(); delete o.ex; store.set('own', l); return renderOwn(); }
  const ldel = t.closest('[data-log-del]'); if(ldel){ const l=logLoad(); l.splice(+ldel.dataset.logDel,1); store.set('worklog', l); return renderLog(); }
  if(t.id==='ownAdd'){ const n=$('#ownN').value.trim(); if(!n){ $('#ownN').focus(); return; } const l=ownLoad(); l.push({n, t:$('#ownT').value, f:$('#ownF').value, s:'Healthy', r:today()}); store.set('own', l); $('#ownN').value=''; return renderOwn(); }
  if(t.id==='logAdd'){ const w=$('#logW').value.trim(); if(!w){ $('#logW').focus(); return; } const l=logLoad(); l.push({d:$('#logD').value||today(), w, c:$('#logC').value, i:$('#logI').value.trim(), e:$('#logE').value.trim()}); store.set('worklog', l); ['logW','logI','logE'].forEach(id=>$('#'+id).value=''); return renderLog(); }
  if(t.id==='logCopy'){ const l=logLoad().slice().sort((a,b)=>a.d.localeCompare(b.d)); const by={}; l.forEach(x=>(by[x.c]=by[x.c]||[]).push(x));
    const own=ownLoad().map(o=>`- ${o.n} (${o.s})`).join('\n');
    const txt = 'WORK SUMMARY\n\nWhat I own\n'+own+'\n\n'+Object.entries(by).map(([k,v])=>k.toUpperCase()+'\n'+v.map(x=>`- ${x.d}: ${x.w}${x.i?' -> '+x.i:''}${x.e?' [evidence: '+x.e+']':''}`).join('\n')).join('\n\n');
    const ta=$('#logText'); ta.value=txt; const show=()=>{ ta.hidden=false; ta.select(); };
    try{ navigator.clipboard.writeText(txt).then(()=>{ t.textContent='Copied'; ta.hidden=false; }, show); }catch(err){ show(); } return; }
  const sc = t.closest('[data-solcat]'); if(sc){ solCat = sc.dataset.solcat; return renderSolList(); }
  const so = t.closest('[data-sol]'); if(so) return showSol(+so.dataset.sol, !so.classList.contains('chip'));
  const hq = t.closest('[data-hq]'); if(hq){ const [q,o]=hq.dataset.hq.split('|').map(Number); hostAns[q]=o; return calcHost(); }
  const vdel = t.closest('[data-vdel]'); if(vdel){ const l=valLoad(); l.splice(+vdel.dataset.vdel,1); store.set('value', l); return renderVal(); }
  if(t.id==='valAdd'){ const l=valLoad(); l.push({n:'New value KPI', b:0, t:0, c:0, v:0}); store.set('value', l); return renderVal(); }
  if(t.id==='valReset'){ store.set('value', VAL_DEFAULT.map(v=>({...v}))); return renderVal(); }
  const bc = t.closest('[data-bvrcase]'); if(bc) return showBvrCase(+bc.dataset.bvrcase);
  const op = t.closest('[data-opp]'); if(op) return showOpp(+op.dataset.opp, 0);
  const os = t.closest('[data-ostep]'); if(os) return showOpp(oppSel, +os.dataset.ostep);
  const pp = t.closest('[data-pparty]'); if(pp) return renderPeople(pp.dataset.pparty);
  const rr = t.closest('[data-rr]'); if(rr) return showR(+rr.dataset.rr);
  const rq = t.closest('[data-rq]'); if(rq){ const q=RQ[rqi]; rqi = rq.dataset.rq===q[1] ? String(q[2]) : rqi+1; return renderRQ(); }
  if(t.id==='rqReset'){ rqi=0; return renderRQ(); }
  const psc = t.closest('[data-pscat]'); if(psc){ psCat=psc.dataset.pscat; return renderPSList(); }
  const ps = t.closest('[data-ps]'); if(ps) return showPS(+ps.dataset.ps);
  const ot = t.closest('[data-otree]'); if(ot) return showOrgNode(ot.dataset.otree);
  const asg = t.closest('[data-asg]'); if(asg){ const [g,a]=asg.dataset.asg.split('|').map(Number); return showAsg(g,a); }
  const jo = t.closest('[data-pipe^="jmlorbit|"]'); if(jo){ const k=+jo.dataset.pipe.split('|')[1]; document.querySelectorAll('[data-pipe^="jmlorbit|"]').forEach(g=>g.classList.toggle('on', g===jo)); if(k<3){ jmlSel=Object.keys(JML)[k]; renderJML(); } else $('#fd-accrev')?.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  const jm = t.closest('[data-jml]'); if(jm){ jmlSel=jm.dataset.jml; return renderJML(); }
  if(t.id==='jmlReset'){ store.set('jml-'+jmlSel, []); return renderJML(); }
  const ctd = t.closest('[data-ctdel]'); if(ctd){ const l=ctLoad(); l.splice(+ctd.dataset.ctdel,1); store.set('certs', l); return renderCerts(); }
  if(t.id==='ctAdd'){ const n=$('#ctN').value.trim(); if(!n){ $('#ctN').focus(); return; } const l=ctLoad(); l.push({n, c:$('#ctC').value, d:$('#ctD').value, l:$('#ctL').value}); store.set('certs', l); $('#ctN').value=''; return renderCerts(); }
  const sq = t.closest('[data-seq]'); if(sq) return showSeq(+sq.dataset.seq);
  const bz = t.closest('[data-biz]'); if(bz) return showBiz(+bz.dataset.biz);
  if(t.id==='glReset'){ store.set('golive', []); return renderGL(); }
  const rqp = t.closest('[data-req]'); if(rqp) return showReq(rqp.dataset.req);
  const dm = t.closest('[data-dm]'); if(dm) return showDM(+dm.dataset.dm);
  const lp = t.closest('[data-lp]'); if(lp) return showLP(+lp.dataset.lp);
  const tp = t.closest('[data-tpl]'); if(tp){ tplSel=tp.dataset.tpl; return renderTpl(); }
  if(t.id==='tplCopy'){ const txt=TEMPLATES[tplSel]; try{ navigator.clipboard.writeText(txt).then(()=>{ t.textContent='Copied'; setTimeout(()=>t.textContent='Copy template',1500); }, ()=>getSelection().selectAllChildren($('#tplOut'))); }catch(err){ getSelection().selectAllChildren($('#tplOut')); } return; }
  if(t.id==='fcFlip'){ cardFlip=!cardFlip; return renderFC(); }
  if(t.id==='fcNext'){ cardI=(cardI+1)%CARDS.length; cardFlip=false; return renderFC(); }
  if(t.id==='fcPrev'){ cardI=(cardI-1+CARDS.length)%CARDS.length; cardFlip=false; return renderFC(); }
  const cat = t.closest('[data-cat]'); if(cat){ svcCat = cat.dataset.cat; document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed', b===cat)); return renderSvc(); }
  const uc = t.closest('[data-uc]'); if(uc){ ucFilter = uc.dataset.uc; document.querySelectorAll('[data-uc]').forEach(b=>b.setAttribute('aria-pressed', b===uc)); return renderUC(); }
  const opt = t.closest('[data-q]');
  if(opt && !qanswered){ qanswered = true; const q = QUIZ[qi], pick = +opt.dataset.q;
    document.querySelectorAll('[data-q]').forEach(b=>{ const i=+b.dataset.q; if(i===q[2]) b.classList.add('right'); else if(i===pick) b.classList.add('wrong'); });
    if(pick===q[2]) qscore++;
    $('#qFb').innerHTML = `<p class="small" style="margin-top:6px">${pick===q[2]?'<b style="color:var(--good)">Correct.</b>':'<b style="color:var(--bad)">Not quite.</b>'} ${q[3]}</p><div style="margin-top:8px"><button class="btn" type="button" id="qNext">${qi===QUIZ.length-1?'See result':'Next question'}</button></div>`;
    return; }
  if(t.id==='qNext'){ qi++; return renderQuiz(); }
  if(t.id==='qRestart'){ qi=0; qscore=0; return renderQuiz(); }
  if(t.id==='closeReset'){ store.set('close', []); return route(); }
  if(t.id==='themeBtn'){ const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); document.documentElement.dataset.theme = cur==='dark'?'light':'dark'; }
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.ck !== undefined){ let d = store.get('check', []); const i=+t.dataset.ck; d = t.checked ? [...new Set([...d,i])] : d.filter(x=>x!==i); store.set('check', d);
    t.closest('.check').classList.toggle('done', t.checked); const p = Math.round(d.length/CHECKLIST.length*100); $('#pct').textContent = p+'%'; $('#pbar').style.width = p+'%'; }
  if(t.dataset.ownSt !== undefined){ const l=ownLoad(); const o=l[+t.dataset.ownSt]; o.s=t.value; delete o.ex; store.set('own', l); return renderOwn(); }
  if(t.dataset.jmlck !== undefined){ let d=store.get('jml-'+jmlSel, []); const i=+t.dataset.jmlck; d = t.checked ? [...new Set([...d,i])] : d.filter(x=>x!==i); store.set('jml-'+jmlSel, d); return renderJML(); }
  if(t.dataset.glck !== undefined){ let d=store.get('golive', []); const i=+t.dataset.glck; d = t.checked ? [...new Set([...d,i])] : d.filter(x=>x!==i); store.set('golive', d); return renderGL(); }
  if(t.dataset.q30 !== undefined){ let d=store.get('q30', []); const i=+t.dataset.q30; d = t.checked ? [...new Set([...d,i])] : d.filter(x=>x!==i); store.set('q30', d); return renderQ30(); }
  if(t.dataset.dc !== undefined){ let d = store.get('dealcheck', []); const i=+t.dataset.dc; d = t.checked ? [...new Set([...d,i])] : d.filter(x=>x!==i); store.set('dealcheck', d); t.closest('.check').classList.toggle('done', t.checked); }
  if(t.dataset.cl !== undefined){ let d = store.get('close', []); const i=+t.dataset.cl; d = t.checked ? [...new Set([...d,i])] : d.filter(x=>x!==i); store.set('close', d); t.closest('.check').classList.toggle('done', t.checked); }
});
document.addEventListener('input', e => {
  const id = e.target.id||'';
  if(id==='svcQ') renderSvc();
  if(id==='glQ') renderGl();
  if(id==='chQ') renderCh();
  if(id.startsWith('wp')) calcWP();
  if(id.startsWith('mp')) calcMP();
  if(id.startsWith('ds')) calcDSO();
  if(id.startsWith('tc')) calcTCO();
  if(['fcC','fcB','fcP','fcT'].includes(id)) calcFC();
  if(id.startsWith('fn')) calcFunnel();
  if(id.startsWith('utm')) calcUTM();
  if(id.startsWith('hs')) calcHS();
  if(id.startsWith('im') || id.startsWith('cr')) calcImpact();
  if(id==='valCost'){ store.set('valcost', +e.target.value||0); valSummary(); }
  if(e.target.dataset.vf){ const l=valLoad(), i=+e.target.dataset.vi; l[i][e.target.dataset.vf]=e.target.value; store.set('value', l); const c=$('#valR'+i); if(c) c.textContent=money(valCalc(l[i]).realised); valSummary(); }
  if(id.startsWith('ai')) calcAI();
  if(id.startsWith('ce')) calcCE();
  if(e.target.dataset.kf) kpiField(e.target, false);
});
document.addEventListener('change', e => { if(e.target.dataset.kf) kpiField(e.target, true); if(e.target.dataset.vf){ const l=valLoad(); delete l[+e.target.dataset.vi].ex; store.set('value', l); renderVal(); } });
document.addEventListener('keydown', e => { const sv = e.target.closest && e.target.closest('svg [data-pipe], svg [data-portal], svg [data-rr], svg [data-otree], svg [data-seq], svg [data-biz], svg [data-req]'); if(sv && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); sv.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
  const a = e.target.closest && e.target.closest('[data-ai]'); if(a && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); showAI(+a.dataset.ai); } });
function kpiField(el, rerender){ const l = kpiLoad(), i = +el.dataset.ki; if(!l[i]) return; l[i][el.dataset.kf] = el.value; delete l[i].ex; kpiSave(l);
  if(rerender || el.dataset.kf!=='n'){ const row = el.closest('.kpirow'), s = kpiStatus(l[i]); row.querySelector('.pill').textContent = s[0]; row.querySelector('.pill').style.color = s[1]; const bar = row.querySelector('.kbar i'); bar.style.width = (s[2]/1.2*100)+'%'; bar.style.background = s[1]; const tg = row.querySelector('.tag'); if(tg) tg.remove(); } }

route();
</script>
